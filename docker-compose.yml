version: '3.8'  #Docker Compose version.
services:  #Every application consists of services..for now mySQL..later springboot,kafka
  mysql:
    image: mysql:8   #Download official MySQL Version 8
    container_name: payment-mysql
    restart: always   #Whenever Docker restarts,MySQL starts automatically
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_gateway
    ports:
      - "3307:3306"   #springboot port:docker container port
    volumes:
      - mysql-data:/var/lib/mysql   #persistent database
volumes:
  mysql-data: